<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jarvis</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="jarvis-dark">
  
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <button class="icon-btn" id="history-toggle" aria-label="History">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
    </button>
    
    <!-- Model Selector Header Dropdown -->
    <div class="model-dropdown-container">
      <button id="model-dropdown-btn" class="model-dropdown-btn" type="button">
        <span id="current-model-label">Jarvis 1.5 mini</span>
        <svg class="dropdown-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <!-- Model List Menu -->
      <div id="model-menu" class="model-menu">
        <!-- 1. Jarvis 1.5 mini (Gemini 1.5 Flash) -->
        <div class="model-menu-item active" data-model="gemini-1.5-flash" data-label="Jarvis 1.5 mini">
          <div class="model-item-info">
            <span class="model-name">Jarvis 1.5 mini</span>
            <span class="model-desc">Fast, responsive & reliable</span>
          </div>
        </div>

        <!-- 2. Jarvis 2.5 max (ఇక్కడ gemini-2.0-flash పెట్టడం వల్ల 404 రాదు) -->
        <div class="model-menu-item" data-model="gemini-2.0-flash" data-label="Jarvis 2.5 max">
          <div class="model-item-info">
            <span class="model-name">Jarvis 2.5 max</span>
            <span class="model-desc">Next-gen intelligence & speed</span>
          </div>
        </div>

        <!-- 3. Jarvis 3.8 max-pro (Gemini 1.5 Flash లేదా స్థిరమైన లైట్‌వెయిట్ మోడల్) -->
        <div class="model-menu-item" data-model="gemini-1.5-flash" data-label="Jarvis 3.8 max-pro">
          <div class="model-item-info">
            <span class="model-name">Jarvis 3.8 max-pro</span>
            <span class="model-desc">Ultra lightweight & quick</span>
          </div>
        </div>
      </div>
    </div>


    <button class="icon-btn" id="settings-btn" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>


  <!-- Center Stage -->
  <main class="core-stage">
    <div class="sphere-wrapper">
      <canvas id="particle-sphere"></canvas>
    </div>

    <div class="greeting-box">
      <h1 id="dynamic-greeting">Evening, Eshwar.</h1>
      <p class="sub-prompt">Say "open Spotify" — Jarvis launches apps</p>
      <div class="action-tags">
        <span>Tell me what to build next</span>
        <span class="dot">·</span>
        <span>Not now</span>
        <span class="dot">·</span>
        <span>Don't ask again</span>
      </div>
    </div>

    <div id="chat" class="chat-overlay"></div>
  </main>

  <!-- Bottom Floating Pill & Navigation -->
  <footer class="bottom-controls">
    <div class="type-pill-btn" id="type-trigger">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><line x1="6" y1="8" x2="6" y2="8"></line><line x1="10" y1="8" x2="10" y2="8"></line><line x1="14" y1="8" x2="14" y2="8"></line><line x1="18" y1="8" x2="18" y2="8"></line><line x1="6" y1="12" x2="6" y2="12"></line><line x1="10" y1="12" x2="10" y2="12"></line><line x1="14" y1="12" x2="14" y2="12"></line><line x1="18" y1="12" x2="18" y2="12"></line><line x1="7" y1="16" x2="17" y2="16"></line></svg>
      <span>Type</span>
    </div>

    <div class="input-drawer" id="input-drawer" style="display: none;">
      <input type="text" id="msg" placeholder="Ask Jarvis anything..." />
      <button id="send" class="send-button">➤</button>
    </div>
        <nav class="bottom-tabs">
      <button class="tab-item active">
        <span>Jarvis</span>
      </button>
      <button class="tab-item">
        <span>Today</span>
      </button>
      <button class="tab-item">
        <span>Memory</span>
      </button>
      <button class="tab-item">
        <span>Files</span>
      </button>
    </nav>
  </footer>
  
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.run/@google/genai"
  }
}
</script>

  <script type="module" src="script.js?v=2"></script>
  
    <!-- Main Action Controls (Bottom) -->
  <div class="bottom-action-bar">
    
  <!-- Main Action Controls (Orbit) -->
  <div class="action-menu-container" id="actionMenuContainer">
    <button id="close-btn" class="circle-btn small-btn orbit-btn btn-left">✕</button>

    <button id="mic-main-btn" class="circle-btn mic-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" x2="12" y1="19" y2="22"></line>
      </svg>
    </button>

    <button id="plus-menu-btn" class="circle-btn small-btn orbit-btn btn-right">+</button>
  </div>

  <!-- Backdrop Overlay -->
  <div id="action-sheet-backdrop" class="sheet-backdrop"></div>

  <!-- Bottom Sheet Menu -->
  <div id="action-sheet-menu" class="action-sheet">
    <div class="action-item" id="act-take-photo">Take photo</div>
    <div class="action-item" id="act-photo-library">Photo library</div>
    <div class="action-item" id="act-file">File</div>
    <div class="action-item" id="act-live-camera">Live camera</div>
  </div>

  <!-- Hidden Native Inputs -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
  <input type="file" id="gallery-input" accept="image/*" style="display: none;">
  <input type="file" id="file-input" style="display: none;">
    
<!-- Live Camera Modal -->
<div id="live-camera-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:2000; flex-direction:column; align-items:center; justify-content:center;">
  <video id="camera-stream" autoplay playsinline style="width:100%; height:80%; object-fit:cover;"></video>
  <div style="position:absolute; bottom:30px; display:flex; gap:20px; align-items:center;">
    <button id="snap-photo-btn" style="width:65px; height:65px; border-radius:50%; background:#fff; border:4px solid #2563eb; cursor:pointer;"></button>
    <button id="close-camera-btn" style="position:absolute; right:-70px; width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.2); border:none; color:#fff; font-size:20px;">✕</button>
  </div>
  <canvas id="camera-canvas" style="display:none;"></canvas>
</div>


</body>
</html>
