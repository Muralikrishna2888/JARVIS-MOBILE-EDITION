<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>J.A.R.V.I.S — Protocol Alpha</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- ORBS VISUAL ENGINE -->
  <script src="https://cdn.jsdelivr.net/npm/orbs@latest/dist/orbs.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/orbs@latest/dist/orbs.css">
  
  <style>
    #jarvis-core-container {
      width: 150px;
      height: 150px;
      margin: 0 auto 20px auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #jarvis-core-container canvas {
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(0, 255, 255, 0.45);
      filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.65));
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <a class="brand" href="./">
          <span class="brand-mark">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><path d="M18 7v22M7 18h22M10.2 10.2l15.6 15.6M25.8 10.2 10.2 25.8"/><circle cx="18" cy="18" r="4"/></svg>
          </span>
          <span class="brand-copy"><strong>J.A.R.V.I.S</strong><small>PROTOCOL ALPHA</small></span>
        </a>
        <button class="icon-button sidebar-collapse" id="sidebar-toggle" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat" type="button">
        <span class="new-chat-icon">+</span><span>New protocol</span>
      </button>

      <div class="history-heading"><span>PROTOCOLS</span><span class="history-count" id="history-count"></span></div>
      <div class="history-list" id="history-list" role="group"></div>
      <div class="sidebar-spacer"></div>

      <div class="sidebar-footer">
        <div class="profile-row"><span class="profile-avatar">E</span><span class="profile-name">Eshwar</span><span class="profile-label">BOSS</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-btn" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title"><span>J.A.R.V.I.S</span><span class="topbar-divider">/</span><span class="topbar-subtitle">System Online</span></div>
        <div class="topbar-actions">
          <span class="ready-badge"><span class="ready-dot"></span> ACTIVE</span>
          <button class="icon-button clear-button" id="clear-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-.8 13H6.8L6 7m4 3v6m4-6v6"/></svg>
          </button>
        </div>
      </header>

      <section class="conversation-stage" id="conversation-stage" tabindex="0">
        <div class="welcome" id="welcome">
          <div id="jarvis-core-container" aria-hidden="true"></div>
          
          <div class="welcome-copy">
            <p class="eyebrow"><span></span> SYSTEMS FULLY OPERATIONAL</p>
            <h1>At your service, Boss.</h1>
            <p class="welcome-subtitle">Awaiting your command for diagnostics, queries, or directives.</p>
          </div>
          <div class="prompt-grid">
            <button class="prompt-card" type="button" data-prompt="Run system status diagnostic">
              <span class="prompt-icon">✦</span><span><strong>Diagnostics</strong><small>Check system protocols</small></span><span class="prompt-arrow">↗</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="What is the current weather?">
              <span class="prompt-icon">◌</span><span><strong>Local Weather</strong><small>Query atmospheric status</small></span><span class="prompt-arrow">↗</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="Open YouTube">
              <span class="prompt-icon">◇</span><span><strong>Open YouTube</strong><small>Launch media interface</small></span><span class="prompt-arrow">↗</span>
            </button>
            <button class="prompt-card" type="button" data-prompt="Tell me a joke">
              <span class="prompt-icon">⌁</span><span><strong>Standby Routine</strong><small>Query witty remarks</small></span><span class="prompt-arrow">↗</span>
            </button>
          </div>
        </div>
        <div class="chat" id="chat" role="log" tabindex="0"></div>
      </section>

      <footer class="composer-dock">
        <div class="thinking-status" id="thinking-status" hidden>
          <span class="thinking-orb" aria-hidden="true"><i class="thinking-ring"></i><i class="thinking-core"></i></span>
          <span id="thinking-label">J.A.R.V.I.S is processing</span><span class="thinking-dots"><i></i><i></i><i></i></span>
        </div>
        <div class="composer-shell">
          <textarea id="msg" rows="1" placeholder="Issue directive to J.A.R.V.I.S..."></textarea>
          <div class="composer-actions">
            <button class="composer-tool voice-button" id="mic-btn" type="button" title="Voice directive">
              <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg>
            </button>
            <button class="send-button" id="send" type="button" title="Transmit">
              <svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-note">ENTER TO TRANSMIT <span>·</span> J.A.R.V.I.S PROTOCOL V3.6</p>
      </footer>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
