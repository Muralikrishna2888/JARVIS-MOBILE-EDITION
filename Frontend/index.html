<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="jarvis-dark">
  <!-- Top Bar -->
  <header class="top-nav">
    <button class="icon-btn" id="history-toggle">🕒</button>
    <div class="jarvis-title">Jarvis ▾</div>
    <button class="icon-btn" id="settings-btn">⚙️</button>
  </header>

  <!-- Main Visual Area -->
  <main class="core-stage">
    <!-- Animated Sphere Canvas -->
    <canvas id="particle-sphere"></canvas>

    <div class="greeting-box">
      <h1 id="dynamic-greeting">Evening, Eshwar.</h1>
      <p class="sub-prompt">Ask about today's news</p>
      <div class="action-tags">
        <span>Tell me what to build next</span>
        <span>·</span>
        <span>Not now</span>
        <span>·</span>
        <span>Don't ask again</span>
      </div>
    </div>

    <!-- Hidden Chat Container for responses -->
    <div id="chat" class="chat-overlay"></div>
  </main>

  <!-- Input & Bottom Controls -->
  <footer class="bottom-controls">
    <div class="type-pill-btn" id="type-trigger">
      ⌨️ <span>Type</span>
    </div>

    <!-- Input Drawer (Hidden by default, opens on Type click) -->
    <div class="input-drawer" id="input-drawer" style="display: none;">
      <input type="text" id="msg" placeholder="Ask Jarvis anything..." />
      <button id="send" class="send-button">➤</button>
    </div>

    <nav class="bottom-tabs">
      <button class="tab-item active" id="wake-btn">
        <span class="tab-icon">🔮</span>
        <span class="tab-label">Jarvis</span>
      </button>
      <button class="tab-item">
        <span class="tab-icon">📋</span>
        <span class="tab-label">Today</span>
      </button>
      <button class="tab-item">
        <span class="tab-icon">🧠</span>
        <span class="tab-label">Memory</span>
      </button>
      <button class="tab-item">
        <span class="tab-icon">📁</span>
        <span class="tab-label">Files</span>
      </button>
    </nav>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
